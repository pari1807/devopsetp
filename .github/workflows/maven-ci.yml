name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    steps:
      - name: Checkout source for Java ${{ matrix.java }}
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Maven tests
        id: maven-test
        run: mvn test

      - name: Report result for Java ${{ matrix.java }}
        if: always()
        run: |
          if [ "${{ steps.maven-test.outcome }}" = "success" ]; then
            echo "Java ${{ matrix.java }}: PASS"
          else
            echo "Java ${{ matrix.java }}: FAIL"
          fi
